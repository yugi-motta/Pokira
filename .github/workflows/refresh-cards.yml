name: Refresh TCGdex metadata
on:
  schedule:
    - cron: '23 19 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tcgdex-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/cache@v4
        with:
          path: .cache/tcgdex
          key: tcgdex-v1-${{ github.run_id }}
          restore-keys: tcgdex-v1-
      - run: npm ci
      - run: npm run refresh:cards
      - run: npm run build
      - run: npm test
      - name: Publish refreshed metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/tcgdex
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh TCGdex card metadata'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
